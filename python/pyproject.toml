[project]
name = "pirtis"
version = "0.0.0"
description = "Pirtis on Wheels: the receptionist"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
harness = "pirtis.cmd.harness:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pirtis"]

[tool.pytest.ini_options]
testpaths = ["pirtis"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
